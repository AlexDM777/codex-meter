function renderSettings(){const key=JSON.stringify([state.language,state.selectedSkin,state.themes.map(t=>t.id),state.autoUpdate,state.randomSkin,state.pinned,state.opacity,state.account,state.signedIn,state.usage.plan,state.updateStatus,state.updateAvailable,state.updateBusy,state.selectedMinutes,state.startup]);if(key===settingsKey)return;settingsKey=key;root.innerHTML=`<section class="settings"><h1>${esc(T('Настройки'))}</h1><div class="sub">CodexMeter ${esc(state.version)} · macOS · ${esc(state.usage.plan)}</div><div class="row"><select aria-label="${esc(T('Язык'))}" onchange="send('language',this.value)">${['Русский','English','Deutsch','Italiano','Español','Srpski','Français','Português'].map((n,i)=>`<option value="${['ru','en','de','it','es','sr','fr','pt'][i]}" ${state.language===['ru','en','de','it','es','sr','fr','pt'][i]?'selected':''}>${n}</option>`).join('')}</select><select aria-label="${esc(T('Показывать лимит'))}" onchange="send('quota',+this.value)"><option value="0">${esc(T('Авто · неделя, иначе самое длительное окно'))}</option>${state.usage.windows.map(q=>`<option value="${q.minutes}" ${state.selectedMinutes===q.minutes?'selected':''}>${esc(label(q))}</option>`).join('')}</select></div><h2>${esc(T('Скин'))}</h2><div class="gallery">${state.themes.map((s,i)=>`<button class="theme ${state.selectedSkin===s.id?'selected':''}" onclick="send('skin','${s.id}')" onmouseenter="send('preview','${s.id}')" onmouseleave="send('cancelPreview')"><canvas data-theme="${i}" width="200" height="200"></canvas><span>${esc(s.number+'. '+T(s.name))}</span></button>`).join('')}</div><div class="row">${checkbox('Каждый запуск — новый скин','random',state.randomSkin)}</div><h2>${esc(T('Пользовательские скины'))}</h2><div class="row">${action('Загрузить скин…','import')}${action('Скопировать MD-инструкцию','guide')}${action('Открыть папку скинов','folder')}${action('Обновить список','reload')}</div><h2>${esc(T('Аккаунт'))}</h2><div class="sub">${esc(state.account||T('не выполнен вход'))}</div><div class="row">${action(state.signedIn?'Выйти из ChatGPT':'Войти в ChatGPT…','login')}${action('Путь к Codex…','cli')}${action('Обновить показатели','refresh')}</div><h2>${esc(T('Обновить программу'))}</h2><div class="hint">${esc(state.updateAvailable?T('Доступно обновление')+' '+state.updateVersion:state.updateStatus)}</div><div class="row">${action(state.updateAvailable?'Обновить программу':'Проверить обновления программы','update')}</div><div class="row">${checkbox('Автоматически обновлять программу','autoUpdate',state.autoUpdate)}</div><h2>macOS</h2><div class="row">${checkbox('Поверх окон','pin',state.pinned)}${checkbox('Запускать с Windows','startup',state.startup).replace(esc(T('Запускать с Windows')),state.language==='ru'?'Запускать при входе в macOS':'Launch at login')}</div><div class="row">${action('Скриншот приложения в буфер','screenshot')}${action('Выход из приложения','quit')}</div><p class="hint">${esc(state.status)}</p></section>`;for(const canvas of root.querySelectorAll('canvas[data-theme]')){const s=state.themes[+canvas.dataset.theme],c=canvas.getContext('2d');c.scale(.4,.4);tile(c,s,{minutes:10080,remaining:67,reset:Date.now()/1000+273960},500,'preview-'+s.id,false);const im=image(s);if(!im.complete)im.addEventListener('load',()=>{const ctx=canvas.getContext('2d');ctx.clearRect(0,0,500,500);tile(ctx,s,{minutes:10080,remaining:67,reset:Date.now()/1000+273960},500,'preview-'+s.id,false)},{once:true})}}
window.receive=next=>{const oldSkin=state?.skin;state=next;kind=state.kind;palette(currentTheme());if(kind==='widget'){if(!document.getElementById('widget'))root.innerHTML='<canvas id="widget" aria-label="CodexMeter"></canvas>';if(oldSkin!==state.skin){anim.clear();notifiedSkin=''}paint()}else if(kind==='settings')renderSettings();else renderHover()};window.addEventListener('resize',paint);let lastMinute='';setInterval(()=>{const minute=state?state.usage.windows.map(countdown).join('|'):'';if(minute!==lastMinute){lastMinute=minute;paint()}},1000);
</script></body></html>
